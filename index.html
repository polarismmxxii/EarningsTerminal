            cells += `<td class="right ${isNegative(row[col.key]) ? 'negative' : 'positive'}">${formatNumber(row[col.key])}</td>`;
          } else {
            cells += `<td class="right">${formatNumber(row[col.key])}</td>`;
          }
        });

        tr.innerHTML = cells;
        tbody.appendChild(tr);
      });

      const profitable = currentData.filter(r => !isNegative(r['Net Profit 9M26']) && r['Net Profit 9M26'] && r['Net Profit 9M26'] !== '-').length;
      statsEl.innerHTML = `
        <div class="stat">Showing <strong>${pageData.length}</strong> of <strong>${currentData.length}</strong> stocks (filtered from ${rawData.length})</div>
        <div class="stat">Profitable (9M26): <strong style="color:var(--green)">${profitable}</strong></div>
        <div class="stat">Loss-making: <strong style="color:var(--red)">${currentData.length - profitable}</strong></div>
      `;

      renderPagination();
    }

    function renderPagination() {
      const total = totalPages();
      let html = '';

      html += `<button onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>‹ Prev</button>`;

      const maxVisible = 7;
      let start = Math.max(1, currentPage - Math.floor(maxVisible / 2));
      let end = Math.min(total, start + maxVisible - 1);
      if (end - start + 1 < maxVisible) {
        start = Math.max(1, end - maxVisible + 1);
      }

      if (start > 1) {
        html += `<button onclick="goToPage(1)">1</button>`;
        if (start > 2) html += `<span class="page-info">…</span>`;
      }

      for (let i = start; i <= end; i++) {
        html += `<button class="${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
      }

      if (end < total) {
        if (end < total - 1) html += `<span class="page-info">…</span>`;
        html += `<button onclick="goToPage(${total})">${total}</button>`;
      }

      html += `<button onclick="goToPage(${currentPage + 1})" ${currentPage === total ? 'disabled' : ''}>Next ›</button>`;
      html += `<span class="page-info">Page ${currentPage} of ${total}</span>`;

      paginationEl.innerHTML = html;
    }

    function goToPage(page) {
      const total = totalPages();
      if (page < 1 || page > total) return;
      currentPage = page;
      renderTable();
      document.querySelector('.table-wrapper').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function applyFilters() {
      const q = searchInput.value.toLowerCase().trim();
      const sector = sectorFilter.value;

      currentData = rawData.filter(row => {
        const matchSearch = !q || 
          (row.Ticker || '').toLowerCase().includes(q) ||
          (row['Company Name'] || '').toLowerCase().includes(q);
        const matchSector = !sector || row.Sector === sector;
        return matchSearch && matchSector;
      });

      currentPage = 1;

      if (sortCol) {
        sortData(sortCol, false);
      } else {
        renderTable();
      }
    }

    function sortData(col, toggle = true) {
      if (col === '_revDelta' || col === '_profitDelta') return;

      if (toggle) {
        if (sortCol === col) sortAsc = !sortAsc;
        else { sortCol = col; sortAsc = true; }
      }

      document.querySelectorAll('th').forEach(th => {
        th.classList.remove('sorted-asc', 'sorted-desc');
        if (th.dataset.col === col) {
          th.classList.add(sortAsc ? 'sorted-asc' : 'sorted-desc');
        }
      });

      currentData.sort((a, b) => {
        let va = a[col] || '';
        let vb = b[col] || '';

        if (col === 'ROA' || col === 'ROE') {
          va = parseFloat(String(va).replace(/%/g, '')) || 0;
          vb = parseFloat(String(vb).replace(/%/g, '')) || 0;
          return sortAsc ? va - vb : vb - va;
        }

        const na = parseFloat(String(va).replace(/[",%']/g, ''));
        const nb = parseFloat(String(vb).replace(/[",%']/g, ''));

        if (!isNaN(na) && !isNaN(nb)) {
          return sortAsc ? na - nb : nb - na;
        }
        va = String(va).toLowerCase();
        vb = String(vb).toLowerCase();
        if (va < vb) return sortAsc ? -1 : 1;
        if (va > vb) return sortAsc ? 1 : -1;
        return 0;
      });

      currentPage = 1;
      renderTable();
    }

    searchInput.addEventListener('input', applyFilters);
    sectorFilter.addEventListener('change', applyFilters);

    document.querySelectorAll('th').forEach(th => {
      th.addEventListener('click', () => sortData(th.dataset.col));
    });

    renderTable();
  </script>
</body>
</html>
