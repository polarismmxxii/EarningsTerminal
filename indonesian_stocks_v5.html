    const ROWS_PER_PAGE = 20;
    let currentData = [...rawData];
    let currentPage = 1;
    let sortCol = null;
    let sortAsc = true;

    const tbody = document.getElementById('tableBody');
    const headerRow = document.getElementById('headerRow');
    const searchInput = document.getElementById('search');
    const sectorFilter = document.getElementById('sectorFilter');
    const statsEl = document.getElementById('stats');
    const paginationEl = document.getElementById('pagination');

    const columnConfig = [
      { key: 'Ticker', label: 'Ticker', align: 'center' },
      { key: 'Company Name', label: 'Company Name', align: 'left' },
      { key: 'Sector', label: 'Sector', align: 'center' },
      { key: 'Currency', label: 'Currency', align: 'center' },
      { key: 'Revenue 6M26', label: 'Revenue 6M26', align: 'right' },
      { key: 'Revenue 6M25', label: 'Revenue 6M25', align: 'right' },
      { key: '_revDelta', label: '', align: 'center', isDelta: true, type: 'rev' },
      { key: 'Net Profit 6M26', label: 'Net Profit 6M26', align: 'right' },
      { key: 'Net Profit 6M25', label: 'Net Profit 6M25', align: 'right' },
      { key: '_profitDelta', label: '', align: 'center', isDelta: true, type: 'profit' },
      { key: 'Last Prc', label: 'Last Prc', align: 'right' },
      { key: 'PER', label: 'PER', align: 'right' },
      { key: 'PBV', label: 'PBV', align: 'right' },
      { key: 'ROA', label: 'ROA', align: 'right' },
      { key: 'ROE', label: 'ROE', align: 'right' },
    ];

    headerRow.innerHTML = columnConfig.map(col => {
      const cls = col.align === 'center' ? 'center' : (col.align === 'right' ? 'right' : '');
      return `<th class="${cls}" data-col="${col.key}">${col.label}</th>`;
    }).join('');

    const sectors = [...new Set(rawData.map(r => r.Sector).filter(Boolean))].sort();
    sectors.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s;
      opt.textContent = s;
      sectorFilter.appendChild(opt);
    });

    function parseNum(val) {
      if (!val || val === '-' || val === '') return null;
      const cleaned = String(val).replace(/[",]/g, '').trim();
      const num = parseFloat(cleaned);
      return isNaN(num) ? null : num;
    }

    function getDeltaIcon(curr, prev) {
      const a = parseNum(curr);
      const b = parseNum(prev);
      if (a === null || b === null) return '<span class="arrow-flat">●</span>';
      if (a > b) return '<span class="arrow-up">▲</span>';
      if (a < b) return '<span class="arrow-down">▼</span>';
      return '<span class="arrow-flat">●</span>';
    }

    function formatNumber(val) {
      if (!val || val === '-' || val === '') return '—';
      return val;
    }

    function formatPercent(val) {
      if (!val || val === '-' || val === '') return '—';
      const cleaned = String(val).replace(/%/g, '').trim();
      const num = parseFloat(cleaned);
      if (isNaN(num)) return val;
      return num.toFixed(1) + '%';
    }

    function isNegative(val) {
      if (!val) return false;
      const cleaned = String(val).replace(/[",%]/g, '');
      return cleaned.startsWith('-');
    }

    function getPageData() {
      const start = (currentPage - 1) * ROWS_PER_PAGE;
      return currentData.slice(start, start + ROWS_PER_PAGE);
    }

    function totalPages() {
      return Math.max(1, Math.ceil(currentData.length / ROWS_PER_PAGE));
    }

    function renderTable() {
      const pageData = getPageData();
      tbody.innerHTML = '';

      pageData.forEach(row => {
        const tr = document.createElement('tr');
        let cells = '';

        columnConfig.forEach(col => {
          if (col.isDelta) {
            if (col.type === 'rev') {
              cells += `<td class="center">${getDeltaIcon(row['Revenue 6M26'], row['Revenue 6M25'])}</td>`;
            } else {
              cells += `<td class="center">${getDeltaIcon(row['Net Profit 6M26'], row['Net Profit 6M25'])}</td>`;
            }
          } else if (col.key === 'Ticker') {
            cells += `<td class="center ticker">${row.Ticker || ''}</td>`;
          } else if (col.key === 'Company Name') {
            cells += `<td class="company" title="${row['Company Name'] || ''}">${row['Company Name'] || ''}</td>`;
          } else if (col.key === 'Sector' || col.key === 'Currency') {
            cells += `<td class="center">${row[col.key] || ''}</td>`;
          } else if (col.key === 'ROA' || col.key === 'ROE') {
            cells += `<td class="right ${isNegative(row[col.key]) ? 'negative' : ''}">${formatPercent(row[col.key])}</td>`;
          } else if (col.key === 'Net Profit 6M26' || col.key === 'Net Profit 6M25') {
            cells += `<td class="right ${isNegative(row[col.key]) ? 'negative' : 'positive'}">${formatNumber(row[col.key])}</td>`;
          } else {
            cells += `<td class="right">${formatNumber(row[col.key])}</td>`;
          }
        });

        tr.innerHTML = cells;
        tbody.appendChild(tr);
      });

      const profitable = currentData.filter(r => !isNegative(r['Net Profit 6M26']) && r['Net Profit 6M26'] && r['Net Profit 6M26'] !== '-').length;
      statsEl.innerHTML = `
        <div class="stat">Showing <strong>${pageData.length}</strong> of <strong>${currentData.length}</strong> stocks (filtered from ${rawData.length})</div>
        <div class="stat">Profitable (6M26): <strong style="color:var(--green)">${profitable}</strong></div>
        <div class="stat">Loss-making: <strong style="color:var(--red)">${currentData.length - profitable}</strong></div>
      `;

      renderPagination();
    }

    function renderPagination() {
      const total = totalPages();
      let html = '';

      html += `<button onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>‹ Prev</button>`;

      const maxVisible = 7;
      let start = Math.max(1, currentPage - Math.floor(maxVisible / 2));
      let end = Math.min(total, start + maxVisible - 1);
      if (end - start + 1 < maxVisible) {
        start = Math.max(1, end - maxVisible + 1);
      }

      if (start > 1) {
        html += `<button onclick="goToPage(1)">1</button>`;
        if (start > 2) html += `<span class="page-info">…</span>`;
      }

      for (let i = start; i <= end; i++) {
        html += `<button class="${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
      }

      if (end < total) {
        if (end < total - 1) html += `<span class="page-info">…</span>`;
        html += `<button onclick="goToPage(${total})">${total}</button>`;
      }

      html += `<button onclick="goToPage(${currentPage + 1})" ${currentPage === total ? 'disabled' : ''}>Next ›</button>`;
      html += `<span class="page-info">Page ${currentPage} of ${total}</span>`;

      paginationEl.innerHTML = html;
    }

    function goToPage(page) {
      const total = totalPages();
      if (page < 1 || page > total) return;
      currentPage = page;
      renderTable();
      document.querySelector('.table-wrapper').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function applyFilters() {
      const q = searchInput.value.toLowerCase().trim();
      const sector = sectorFilter.value;

      currentData = rawData.filter(row => {
        const matchSearch = !q || 
          (row.Ticker || '').toLowerCase().includes(q) ||
          (row['Company Name'] || '').toLowerCase().includes(q);
        const matchSector = !sector || row.Sector === sector;
        return matchSearch && matchSector;
      });

      currentPage = 1;

      if (sortCol) {
        sortData(sortCol, false);
      } else {
        renderTable();
      }
    }

    function sortData(col, toggle = true) {
      if (col === '_revDelta' || col === '_profitDelta') return;

      if (toggle) {
        if (sortCol === col) sortAsc = !sortAsc;
        else { sortCol = col; sortAsc = true; }
      }

      document.querySelectorAll('th').forEach(th => {
        th.classList.remove('sorted-asc', 'sorted-desc');
        if (th.dataset.col === col) {
          th.classList.add(sortAsc ? 'sorted-asc' : 'sorted-desc');
        }
      });

      currentData.sort((a, b) => {
        let va = a[col] || '';
        let vb = b[col] || '';

        if (col === 'ROA' || col === 'ROE') {
          va = parseFloat(String(va).replace(/%/g, '')) || 0;
          vb = parseFloat(String(vb).replace(/%/g, '')) || 0;
          return sortAsc ? va - vb : vb - va;
        }

        const na = parseFloat(String(va).replace(/[",%]/g, ''));
        const nb = parseFloat(String(vb).replace(/[",%]/g, ''));

        if (!isNaN(na) && !isNaN(nb)) {
          return sortAsc ? na - nb : nb - na;
        }
        va = String(va).toLowerCase();
        vb = String(vb).toLowerCase();
        if (va < vb) return sortAsc ? -1 : 1;
        if (va > vb) return sortAsc ? 1 : -1;
        return 0;
      });

      currentPage = 1;
      renderTable();
    }

    searchInput.addEventListener('input', applyFilters);
    sectorFilter.addEventListener('change', applyFilters);

    document.querySelectorAll('th').forEach(th => {
      th.addEventListener('click', () => sortData(th.dataset.col));
    });

    renderTable();
  </script>
</body>
</html>
